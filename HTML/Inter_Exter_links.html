<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>types Of links</title>
</head>

<body>
    <h1>Internal Links</h1>]
    <p>INTERNAL LINKS
        <a href="about.html">About Us</a>
        <!-- This opens the about.html page located in the same folder. -->/
        <a href="#contact">Go to Contact Section</a>
    <h2 id="contact">Contact Us</h2>
    <!-- Use #id to jump to a specific section. -->
    </p>
    <h2>External Link</h2>
    <p>  
        <!-- Use the target="_blank" attribute to open page in new tab -->

        <a href="https://www.example.com" target="_blank">Open Example</a>

        <!-- Adding rel="noopener noreferrer" for Security -->
        <!-- When using target="_blank", it's recommended to add rel="noopener noreferrer" to prevent security risks. -->

        <a href="https://external.com" target="_blank" rel="noopener noreferrer">
        </a>
    </p>
<!-- Link Type	Example                                      
Internal Link	href="about.html"
Section Jump	href="#section-id"
External Link	href="https://example.com"
New Tab + Safe	target="_blank" rel="noopener" -->

</body>

</html>
