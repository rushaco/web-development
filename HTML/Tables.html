<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>

<body>
    <h1><i>Creating and Working with Tables</i></h1>
    <table border="1">

        <tr>
            <th>SR NO</th>
            <th>Item</th>
            <th>Price</th>
            <th>Discount</th>
        </tr>
        <tr>
            <td>1.</td>
            <td>Apple</td>
            <td>10 RS</td>
            <td>2 RS</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Mango</td>
            <td>15 RS</td>
            <td>3 RS</td>
        </tr>

        <tr>
            <td>3.</td>
            <td>Banana</td>
            <td>5 RS</td>
            <td>1 RS</td>
        </tr>
        <tr>
            <td>4.</td>
            <td>Total</td>
            <td colspan="2">24 RS</td>
        </tr>
<!-- colspan  →  ← →  horizontal 
rowspan  →  ↕   vertical -->  

    </table>
</body>

</html>
