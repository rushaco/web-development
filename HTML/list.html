<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>list</title>
</head>

<body>
    <h1>Unordered List</h1>]
    <!-- this is unordered list meaning it will be in bullet points and fcfs format -->
    <ul>
        <li>Apple</li>
        <li>Samsung</li>
        <li>oppo</li>
    </ul>
    <h2>ordered list</h2>
    <ol>
        <li>Wake UP</li>
        <li>Brush</li>
        <li>Bath</li>
    </ol>
    <h3> Description List </h3>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper text Markup langauge</dd>
        <br>
        <dt>CSS</dt>
        <dd>Cascading Style Sheet</dd>
    </dl>

    <ul>
        <ul>Fruits
            <ol>apple</ol>
            <ol>Mango</ol>
        </ul>
        <ul>Vegtables</ul>
    </ul>



</body>
