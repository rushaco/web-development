<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1><i>GENERAL FORM</i></h1>
    <form action="/process.php">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="your name here">
        <br><br>
        <label for="Phone">Phone Number</label>
        <input type="tel" id="Phone">
        <br><br>
        <label for="Age">age</label>
        <input type="num" id="age">
        <br><br>
        <label for="Gender">Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label>Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label>female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label>OTHER</label>
        <br>

        <p>choose your Sport</p>
        <label for="Sports">Game</label>
        <br>
        <input type="checkbox" id="kabbadi" name="Sports" value="kabbadi">
        <label for="kabbadi">Kabbadi</label>
        <input type="checkbox" id="Cricket" name="Sports" value="Cricket">
        <label>Cricket</label>
        <input type="checkbox" id="Chess" name="Sports" value="kabbadi">
        <label>Chess</label>
        <br><br>
        <label for="City">Choose your City</label>
        <select id="City" name="City">
            <option value=<Delhi>Delhi</option>
            <option value=<Pune>Pune</option>
            <option value=<Mumbai>Mumbai</option>

        </select>
        <br><br>
        <label for ="Message">Your Remark</label>
        <br>
        <textarea name="description" row="3" cols="60" id="description"></textarea>
        <br><br>
        <input type="submit" value="submit">
    </form>
</body>

</html>
